name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  fmt:
    name: Check Zig Formatting
    runs-on: ubuntu-24.04
    environment: Linting
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Ensure ripgrep
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi

      - name: Run Zig fmt
        run: zig fmt --check build.zig build.zig.zon builds src examples tests fuzz

      - name: Check repository conventions
        run: sh scripts/check_conventions.sh

      - name: Check vendored overlays
        run: sh scripts/check_vendor_overlay.sh

      - name: Check release metadata
        run: sh scripts/check_release_version.sh

      - name: Check documentation links
        run: sh scripts/check_docs.sh
