name: HTTP/3 Cross-Implementation Compliance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

concurrency:
  group: http3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compliance:
    name: curl/ngtcp2 and aioquic
    runs-on: ubuntu-24.04
    environment: "HTTP3 Compliance"
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pinned Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.1/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache native build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: ${{ runner.os }}-http3-v3-${{ hashFiles('build.zig', 'builds/**/*.zig', 'build.zig.zon', 'flake.lock', 'patches/**', 'vendor/libxev_overlay/**', 'vendor/lsquic_overlay/**', 'scripts/http3_compliance/flake.lock') }}
          restore-keys: |
            ${{ runner.os }}-http3-v3-

      - name: Build HTTP/3 server in Nix
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if nix develop "path:." -c zig build -Doptimize=ReleaseSafe; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            printf 'Nix input fetch or build failed (attempt %s); retrying in 15s\n' "$attempt" >&2
            sleep 15
          done
          exit 1

      - name: Run cross-implementation gate
        shell: bash
        env:
          HTTP3_ARTIFACT_DIR: ${{ runner.temp }}/http3-compliance
        run: |
          for attempt in 1 2 3; do
            if nix develop "path:." -c \
              nix develop "path:./scripts/http3_compliance" -c \
                bash scripts/http3_compliance/run.sh; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            printf 'Nix input fetch or gate failed (attempt %s); retrying in 15s\n' "$attempt" >&2
            sleep 15
          done
          exit 1

      - name: Upload HTTP/3 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: http3-cross-implementation-evidence
          path: ${{ runner.temp }}/http3-compliance/
          if-no-files-found: error
          retention-days: 30
