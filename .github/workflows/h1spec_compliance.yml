name: h1spec Compliance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

concurrency:
  group: h1spec-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    environment: "h1spec Compliance"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          cache-suffix: release

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.4

      - name: Build compliance server
        run: nix develop "path:." -c zig build -Doptimize=ReleaseSafe

      - name: Start compliance server
        shell: bash
        run: |
          ./zig-out/bin/h1spec >"$RUNNER_TEMP/h1spec_server.log" 2>&1 &
          server_pid=$!
          printf '%s\n' "$server_pid" >"$RUNNER_TEMP/h1spec_server.pid"

          ready=false
          for _ in $(seq 1 100); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/h1spec_server.log"
              exit 1
            fi
            if (exec 3<>/dev/tcp/127.0.0.1/8000) 2>/dev/null; then
              ready=true
              break
            fi
            sleep 0.1
          done
          test "$ready" = true

      - name: Run h1spec
        run: |
          cd vendor/h1spec
          deno run --allow-net=127.0.0.1:8000 http_test.ts 127.0.0.1 8000

      - name: Stop compliance server
        if: ${{ always() }}
        run: |
          if test -f "$RUNNER_TEMP/h1spec_server.pid"; then
            kill "$(cat "$RUNNER_TEMP/h1spec_server.pid")" 2>/dev/null || true
          fi

      - name: Upload server log
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: h1spec-server-log
          path: ${{ runner.temp }}/h1spec_server.log
          if-no-files-found: error
