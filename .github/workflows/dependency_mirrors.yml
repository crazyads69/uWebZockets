name: Dependency Mirrors

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirrors:
    name: Exact mirror equality
    runs-on: ubuntu-24.04
    environment: Linting
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Ensure ripgrep
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi

      - name: Require every fork mirror to match upstream
        run: sh scripts/check_dependency_forks.sh --exact-mirrors
